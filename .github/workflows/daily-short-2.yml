# CHANNEL 2 (Midnight Case Files): makes and posts two Shorts every day.
# Change the times: edit the "cron" lines (they're in UTC).
# "7 5 * * *" = 05:07 UTC (12:07am US Eastern), "7 17 * * *" = 17:07 UTC (12:07pm Eastern).
# Run it right now: GitHub > Actions tab > "Daily Short" > "Run workflow".
name: Daily Short (Channel 2)

on:
  schedule:
    - cron: "7 5 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: a specific topic (leave empty to let AI pick)"
        required: false

permissions:
  contents: write   # lets the bot save history.json (so topics never repeat)

concurrency: daily-short   # shared with channel 1 so the two never save at the same moment

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Make and post today's Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          NICHE: ${{ vars.NICHE2 || 'unsolved mysteries, creepy facts' }}
          HISTORY_FILE: history2.json
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then
            python auto_post.py --topic "$TOPIC"
          else
            python auto_post.py
          fi

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history2.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Log today's Short (channel 2)" && git pull --rebase && git push)

      - name: Keep a copy of the video (downloadable for 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short2-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14
          if-no-files-found: ignore

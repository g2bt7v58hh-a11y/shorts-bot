# Makes and posts one Short every day, for free, on GitHub's computers.
# Change the time: edit the "cron" line (it's in UTC). "37 15 * * *" = 15:37 UTC daily.
# Run it right now: GitHub > Actions tab > "Daily Short" > "Run workflow".
name: Daily Short

on:
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: a specific topic (leave empty to let AI pick)"
        required: false

permissions:
  contents: write   # lets the bot save history.json (so topics never repeat)

concurrency: daily-short

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Make and post today's Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NICHE: ${{ vars.NICHE }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then
            python auto_post.py --topic "$TOPIC"
          else
            python auto_post.py
          fi

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Log today's Short" && git push)

      - name: Keep a copy of the video (downloadable for 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14
          if-no-files-found: ignore
